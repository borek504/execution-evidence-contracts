name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused unit tests
        run: |
          python -B -m unittest -v test_r14_execution_contract
          python -B -m unittest -v test_core_result_envelope
          python -B -m unittest -v test_result_envelope_red_team
          python -B -m unittest -v test_result_envelope_v2_contract
          python -B -m unittest -v test_result_envelope_v2_golden_vectors
